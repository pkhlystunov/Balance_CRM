<!DOCTYPE html>
<html lang="ru">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Стили -->

    <link rel="stylesheet" href="css/notifications.css">
</head>
<body>
    <!-- Кнопка мобильного меню -->

    <!-- Контроль ОТиПБ -->
    <a href="https://pkhlystunov.github.io/balance-cl-sc-v.4.0.1./" class="menu-item" id="menu-control" target="_blank" rel="noopener noreferrer">

        <span>Тестирование по ОТ</span>

</div>
                <div class="menu-section">
                    <div class="menu-section-title">Модули ОТиПБ</div>
                    <a href="personnel.html" class="menu-item" id="menu-personnel"><i class="fas fa-user-graduate"></i><span>Обучение и медосмотры</span></a>
                    <a href="siz-registry.html" class="menu-item" id="menu-siz"><i class="fas fa-vest"></i><span>Реестр СИЗ</span></a>
                    <a href="sout-opr.html" class="menu-item" id="menu-sout"><i class="fas fa-clipboard-list"></i><span>СОУТ и ОПР</span></a>
                    <a href="tech.html" class="menu-item" id="menu-tech"><i class="fas fa-wrench"></i><span>Техника</span></a>
                    <a href="test-analytics.html" class="menu-item" id="menu-analytics"><i class="fas fa-chart-bar"></i><span>Аналитика тестов</span></a>

            </nav>
        </aside>

        <!-- ОСНОВНОЙ КОНТЕНТ -->

            <div class="top-header">

                    <i class="fas fa-user-circle" style="font-size: 1.5rem; color: #3498db;"></i>
                    <span id="user-name">Загрузка...</span>
                </div>
                <div style="display: flex; gap: 15px; align-items: center;">
                    <button class="btn btn-danger" onclick="handleLogout()">

                    </button>
                </div>
            </div>

                    <h2>Центр уведомлений</h2>
                    <div class="top-bar-actions">
                        <button class="btn btn-primary" onclick="markAllRead()">✅ Прочитать все</button>
                    </div>
                </div>

                <div id="notificationList" class="notification-list">
                    <div class="empty-state">
                        <div class="icon">🔔</div>
                        <p>Загрузка уведомлений...</p>
