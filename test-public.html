<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="icon-192.png">
    <title>Тестирование по охране труда</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/test-public.css">
</head>
<body>
    <div class="container">
        <h1>🛡️ Тестирование по охране труда</h1>

        <div class="controls">
            <label for="programSelect">Выберите программу:</label>
            <select id="programSelect"></select>
            <button class="btn" id="startBtn">▶ Начать тест</button>
            <button class="btn btn-secondary" id="resetBtn">↺ Сбросить</button>
        </div>

        <div class="person-fields hidden" id="personFields">
            <div>
                <label for="fioInput">ФИО работника</label>
                <input type="text" id="fioInput" placeholder="Иванов Иван Иванович">
            </div>
            <div>
                <label for="positionInput">Должность</label>
                <input type="text" id="positionInput" placeholder="Инженер">
            </div>
        </div>

        <div id="questionsArea" class="hidden"></div>

        <div id="finishArea" class="hidden">
            <button class="btn btn-success" id="finishBtn" disabled>✔ Завершить тест</button>
            <span id="finishHint" style="margin-left: 15px; color: #666;"></span>
        </div>

        <div id="resultArea" class="hidden"></div>
    </div>

    <script type="module" src="js/pages/test-public.js"></script>
</body>
</html>
